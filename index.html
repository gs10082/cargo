<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>cargo-and-colt</title>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

			
		<style>
			#status { background: #171411; }
			#status-splash {
				position: absolute; inset: 0;
				width: 100%; height: 100%; max-height: none;
				margin: 0; object-fit: cover; object-position: center; image-rendering: auto;
			}
			#status-progress {
				position: absolute; display: block; left: 50%; top: 82.3%; z-index: 1;
				transform: translate(-50%, -50%); width: min(340px, 64vw); height: 16px;
				margin: 0; border: 2px solid #382714;
				border-radius: 3px; background: #241b13; overflow: hidden;
			}
			#status-progress-fill {
				height: 100%; width: 0%; background: #d89a28;
				transform-origin: left center; will-change: width;
			}
		</style>
		<script>
			(() => {
				const loadingImage = 'title-splash.png';
				const applyLoadingArt = () => {
					const splash = document.getElementById('status-splash');
					if (splash) splash.src = loadingImage;
				};
				if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyLoadingArt);
				else applyLoadingArt();
			})();
		</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="title-splash.png" alt="">
			<div id="status-progress" role="progressbar" aria-label="Loading"><div id="status-progress-fill"></div></div>
			<div id="status-notice"></div>
		</div>

		<!-- Reassembles upload-safe Web export chunks before Godot fetches them. -->
		<script src="chunk_loader.js"></script>
		<script src="pointer_capture_bridge.js"></script>
		<script src="hub_game_bridge.js"></script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":26617780,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusProgressFill = document.getElementById('status-progress-fill');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';
	let actualProgress = 0;
	let visualProgress = 0.04;
	let loadStartedAt = performance.now();
	let loadingFinished = false;

	function animateLoadingProgress() {
		if (!initializing || statusProgressFill == null) return;
		const elapsed = performance.now() - loadStartedAt;
		// The engine may report its first byte late, so keep the bar alive below 60%.
		const idleProgress = Math.min(0.58, 0.05 + elapsed / 22000);
		const target = loadingFinished ? 1 : Math.min(0.985, Math.max(actualProgress, idleProgress));
		visualProgress += (target - visualProgress) * (loadingFinished ? 0.22 : 0.055);
		if (loadingFinished && visualProgress > 0.995) visualProgress = 1;
		statusProgressFill.style.width = `${Math.round(visualProgress * 1000) / 10}%`;
		statusProgress.setAttribute('aria-valuenow', String(Math.round(visualProgress * 100)));
		if (!loadingFinished || visualProgress < 1) requestAnimationFrame(animateLoadingProgress);
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		requestAnimationFrame(animateLoadingProgress);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					actualProgress = Math.min(1, current / total);
				}
			},
		}).then(() => {
			loadingFinished = true;
			const closeWhenFilled = () => {
				if (visualProgress >= 1) setStatusMode('hidden');
				else requestAnimationFrame(closeWhenFilled);
			};
			requestAnimationFrame(closeWhenFilled);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
