html, body, #canvas {

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;

	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;

	z-index: 1;
}

		<script>
			// Keep the platform save and leaderboard bridge in the document itself.
			// The Game Hub document worker inspects this entry HTML before Godot starts.
			(() => {
				'use strict';

				const PROFILE_KEY = 'cargo_and_colt_profile';
				const STORY_PROGRESS_KEY = 'cargo_and_colt_story_progress';
				const STORY_PROGRESS_COOKIE = 'cargo_and_colt_story_progress';
				const HUB_STORY_PROGRESS_KEY = 'cargo_and_colt_story_progress_v1';
				const CHALLENGE_KEY = 'cargo_and_colt_survival';
				const CHALLENGE_BEST_KEY = 'cargo_and_colt_survival_best';
				const readLocal = (key) => {
					try {
						const raw = window.localStorage.getItem(key);
						return raw ? JSON.parse(raw) : null;
					} catch (_) {
						return null;
					}
				};
				const writeLocal = (key, value) => {
					try {
						window.localStorage.setItem(key, JSON.stringify(value));
					} catch (_) {
						// Private browsing or quota failures must not interrupt the game.
					}
				};
				const readCookie = (key) => {
					try {
						const match = document.cookie.match(new RegExp(`(?:^|; )${key}=([^;]*)`));
						return match ? JSON.parse(decodeURIComponent(match[1])) : null;
					} catch (_) {
						return null;
					}
				};
				const readStoryProgress = () => readLocal(STORY_PROGRESS_KEY) || readCookie(STORY_PROGRESS_COOKIE);
				const writeStoryProgress = (profile) => {
					const snapshot = {
						cleared_stages: Array.isArray(profile?.cleared_stages) ? profile.cleared_stages : [],
						unlocked_stage: Math.max(1, Number(profile?.unlocked_stage) || 1),
						saved_at: Date.now(),
					};
					writeLocal(STORY_PROGRESS_KEY, snapshot);
					try {
						document.cookie = `${STORY_PROGRESS_COOKIE}=${encodeURIComponent(JSON.stringify(snapshot))}; path=/; max-age=31536000; SameSite=Lax`;
					} catch (_) {
						// localStorage remains the primary same-origin fallback.
					}
					return snapshot;
				};
				const applyStoryProgress = (profile, story) => {
					if (!profile || !story || !Array.isArray(story.cleared_stages)) return profile;
					return {
						...profile,
						cleared_stages: story.cleared_stages,
						unlocked_stage: Math.max(1, Number(story.unlocked_stage) || 1),
						story_progress_saved_at: Number(story.saved_at) || 0,
					};
				};
				const getHub = () => window.HubGame || null;
				const pickNewestProfile = (local, remote) => {
					if (!remote) return local;
					if (!local) return remote;
					const localSavedAt = Number(local.profile_saved_at) || 0;
					const remoteSavedAt = Number(remote.profile_saved_at) || 0;
					// Legacy remote saves have no timestamp. Keep the current browser's
					// progress instead of letting a stale snapshot reset Story progress.
					return remoteSavedAt > localSavedAt ? remote : local;
				};
				const waitForHubMethod = async (method, timeoutMs = 6000) => {
					const startedAt = Date.now();
					do {
						const hub = getHub();
						if (typeof hub?.[method] === 'function') return hub;
						await new Promise((resolve) => window.setTimeout(resolve, 200));
					} while (Date.now() - startedAt < timeoutMs);
					const hub = getHub();
					return typeof hub?.[method] === 'function' ? hub : null;
				};

				window.CargoAndColtHub = {
					async loadStoryProgress() {
						const fallback = readLocal(HUB_STORY_PROGRESS_KEY);
						const hub = await waitForHubMethod('load');
						if (!hub) return { ready: false, value: fallback };
						try {
							const remote = await hub.load(HUB_STORY_PROGRESS_KEY);
							const value = remote && typeof remote === 'object' ? remote : fallback;
							if (value) writeLocal(HUB_STORY_PROGRESS_KEY, value);
							return { ready: true, value };
						} catch (_) {
							return { ready: false, value: fallback };
						}
					},
					async saveStoryProgress(progress) {
						const snapshot = {
							current_story_id: Math.max(0, Number(progress?.current_story_id) || 0),
							completed_story_ids: Array.isArray(progress?.completed_story_ids) ? progress.completed_story_ids : [],
						};
						writeLocal(HUB_STORY_PROGRESS_KEY, snapshot);
						const hub = await waitForHubMethod('save');
						if (!hub) return false;
						try {
							await hub.save(HUB_STORY_PROGRESS_KEY, snapshot);
							return true;
						} catch (_) {
							return false;
						}
					},
					async loadProfile() {
						const fallback = readLocal(PROFILE_KEY);
						const storyProgress = readStoryProgress();
						const hub = await waitForHubMethod('load');
						if (!hub) return { ready: false, value: applyStoryProgress(fallback, storyProgress) };
						try {
							const remote = await hub.load(PROFILE_KEY);
							const value = applyStoryProgress(pickNewestProfile(fallback, remote), storyProgress);
							if (value) writeLocal(PROFILE_KEY, value);
							return { ready: true, value };
						} catch (_) {
							return { ready: false, value: applyStoryProgress(fallback, storyProgress) };
						}
					},
					async saveProfile(profile) {
						const snapshot = { ...profile, profile_saved_at: Date.now() };
						const storyProgress = writeStoryProgress(snapshot);
						snapshot.story_progress_saved_at = storyProgress.saved_at;
						writeLocal(PROFILE_KEY, snapshot);
						const hub = await waitForHubMethod('save');
						if (!hub) return false;
						try {
							await hub.save(PROFILE_KEY, snapshot);
							return true;
						} catch (_) {
							return false;
						}
					},
					async submitChallengeScore(score) {
						const value = Math.max(0, Number(score) || 0);
						const savedBest = Number(readLocal(`${CHALLENGE_KEY}_best`) || 0);
						const hub = await waitForHubMethod('submitScore');
						if (!hub) return false;
						const bestScore = Math.max(value, savedBest);
						try {
							let remoteBest = 0;
							if (typeof hub.load === 'function') {
								try {
									remoteBest = Number(await hub.load(CHALLENGE_BEST_KEY) || 0);
								} catch (_) {
									remoteBest = 0;
								}
							}
							writeLocal(`${CHALLENGE_KEY}_best`, bestScore);
							if (bestScore <= remoteBest) return true;
							await hub.submitScore(CHALLENGE_KEY, bestScore);
							if (typeof hub.save === 'function') {
								try {
									await hub.save(CHALLENGE_BEST_KEY, bestScore);
								} catch (_) {
									// A successful score submission remains valid without this mirror.
								}
							}
							return true;
						} catch (_) {
							return false;
						}
					},
					async overwriteChallengeScore(score) {
						const value = Math.max(0, Number(score) || 0);
						const hub = await waitForHubMethod('submitScore');
						if (!hub) return false;
						try {
							// Debug reset deliberately replaces the platform score instead of
							// applying the normal highest-score-only policy.
							writeLocal(`${CHALLENGE_KEY}_best`, value);
							await hub.submitScore(CHALLENGE_KEY, value);
							if (typeof hub.save === 'function') {
								await hub.save(CHALLENGE_BEST_KEY, value);
							}
							return true;
						} catch (_) {
							return false;
						}
					},
					async getChallengeLeaderboard(limit) {
						const hub = await waitForHubMethod('getLeaderboard');
						if (!hub) {
							const hasHub = !!getHub();
							return {
								available: false,
								rows: [],
								retry: true,
								reason: hasHub ? 'HubGame.getLeaderboard API를 찾지 못했습니다.' : 'HubGame이 문서 페이지에 주입되지 않았습니다.',
							};
						}
						try {
							const rows = await hub.getLeaderboard(CHALLENGE_KEY, Math.max(1, Number(limit) || 10));
							return { available: true, rows: Array.isArray(rows) ? rows : [], retry: false, reason: '' };
						} catch (error) {
							const detail = error instanceof Error ? error.message : String(error || '알 수 없는 서버 오류');
							return { available: false, rows: [], retry: true, reason: `랭킹 서버 요청 실패: ${detail}` };
						}
					},
				};
			})();
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":12547960,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusProgressFill = document.getElementById('status-progress-fill');
	const statusNotice = document.getElementById('status-notice');
	const statusSplash = document.getElementById('status-splash');

	let initializing = true;
	let statusMode = '';
	let actualProgress = 0;
	let visualProgress = 0.04;
	let loadStartedAt = performance.now();
	let loadingFinished = false;
	let titleScreenReady = false;
	let titleReadyFallbackTimer = 0;

	function animateLoadingProgress() {
		if (!initializing || statusProgressFill == null) return;
		const elapsed = performance.now() - loadStartedAt;
		// The engine may report its first byte late, so keep the bar alive below 60%.
		const idleProgress = Math.min(0.58, 0.05 + elapsed / 22000);
		const target = loadingFinished ? 1 : Math.min(0.985, Math.max(actualProgress, idleProgress));
		visualProgress += (target - visualProgress) * (loadingFinished ? 0.22 : 0.055);
		if (loadingFinished && visualProgress > 0.995) visualProgress = 1;
		statusProgressFill.style.width = `${Math.round(visualProgress * 1000) / 10}%`;
		statusProgress.setAttribute('aria-valuenow', String(Math.round(visualProgress * 100)));
		if (!loadingFinished || visualProgress < 1) requestAnimationFrame(animateLoadingProgress);
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function finishLoadingOverlay() {
		if (!initializing || loadingFinished) return;
		if (titleReadyFallbackTimer) {
			window.clearTimeout(titleReadyFallbackTimer);
			titleReadyFallbackTimer = 0;
		}
		loadingFinished = true;
		const closeWhenFilled = () => {
			if (visualProgress >= 1) setStatusMode('hidden');
			else requestAnimationFrame(closeWhenFilled);
		};
		requestAnimationFrame(closeWhenFilled);
	}

	// Godot calls this only after the title scene has rendered. Keeping the splash
	// until then prevents the canvas clear color from flashing between screens.
	window.CargoAndColtLoading = {
		titleScreenReady: () => {
			titleScreenReady = true;
			finishLoadingOverlay();
		},
	};

	function waitForLoadingArt() {
		// Do not let an iOS image decode stall the engine indefinitely. Safari can leave
		// decode() pending when the page is still restoring its WebGL context.
		if (statusSplash == null) return Promise.resolve();
		const decoded = () => typeof statusSplash.decode === 'function'
			? statusSplash.decode().catch(() => undefined)
			: Promise.resolve();
		const imageReady = statusSplash.complete
			? decoded()
			: new Promise((resolve) => {
				const finish = () => decoded().finally(resolve);
				statusSplash.addEventListener('load', finish, { once: true });
				statusSplash.addEventListener('error', resolve, { once: true });
			});
		// The loading art is cosmetic. Start Godot after a short grace period even
		// when the browser never completes decoding it.
		return Promise.race([
			imageReady,
			new Promise((resolve) => window.setTimeout(resolve, 1500)),
		]);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		requestAnimationFrame(animateLoadingProgress);
		waitForLoadingArt().then(() => engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					actualProgress = Math.min(1, current / total);
				}
			},
		})).then(() => {
			if (titleScreenReady) {
				finishLoadingOverlay();
				return;
			}
			// RenderingServer.frame_post_draw is normally the precise handoff. If it
			// is not delivered by iOS Safari, do not leave players behind the splash.
			titleReadyFallbackTimer = window.setTimeout(finishLoadingOverlay, 8000);
		}, displayFailureNotice);
	}
}());
		</script>
